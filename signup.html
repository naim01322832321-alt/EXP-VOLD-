<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EXP VOLD - Sign Up</title>

<link rel="stylesheet" href="style.css">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
.signup-container{
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
background:#0b0b0b;
}

.signup-box{
width:400px;
background:#151515;
padding:30px;
border-radius:15px;
border:2px solid #00ff88;
box-shadow:0 0 20px #00ff88;
text-align:center;
}

.signup-box h1{
color:#00ff88;
margin-bottom:10px;
}

.signup-box p{
color:#ccc;
margin-bottom:20px;
}

.signup-logo{
width:120px;
border-radius:50%;
margin-bottom:20px;
border:3px solid #00ff88;
}

.signup-box input,
.signup-box select{
width:100%;
padding:12px;
margin:8px 0;
border:none;
border-radius:8px;
background:#222;
color:white;
}

.signup-btn{
width:100%;
padding:12px;
margin-top:15px;
background:#00ff88;
color:black;
font-size:18px;
font-weight:bold;
border:none;
border-radius:8px;
cursor:pointer;
transition:.3s;
}

.signup-btn:hover{
background:#00cc6a;
}

.login-link{
margin-top:20px;
}

.login-link a{
color:#00ff88;
text-decoration:none;
font-weight:bold;
}
</style>

</head>

<body>

<div class="signup-container">

<div class="signup-box">

<img src="logo.png" class="signup-logo">

<h1>🎮 EXP VOLD</h1>

<p>Create Your Gaming Account</p>

<form>

<input type="text" placeholder="Player Name" required>

<input type="text" placeholder="Free Fire UID" required>

<select required>
<option>Select Server</option>
<option>Bangladesh</option>
<option>India</option>
<option>Singapore</option>
<option>Brazil</option>
<option>Middle East</option>
</select>

<input type="email" placeholder="Email Address" required>

<input type="password" placeholder="Password" required>

<input type="password" placeholder="Confirm Password" required>

<button class="signup-btn">
Create Account
</button>

</form>

<div class="login-link">

Already have an account?

<a href="login.html">
Login
</a>

</div>

</div>

</div>

</body>
</html>
<input type="text" id="playerName" placeholder="Player Name">

<input type="text" id="uid" placeholder="Free Fire UID">

<input type="email" id="email" placeholder="Email">

<input type="password" id="password" placeholder="Password">

<button type="button" id="signupBtn">Create Account</button>
